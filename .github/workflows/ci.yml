name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chess_academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chess_academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/chess_academy_test
      TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      # Install exactly what uv.lock pins; fail if the lock is out of date with pyproject.toml.
      - run: uv sync --frozen --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Audit pinned dependencies for known vulnerabilities
        run: |
          uv export --frozen --extra dev --format requirements-txt --no-hashes > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"
      - run: ruff check app alembic tests
      - run: ruff format --check app alembic tests
      - run: mypy app
      - run: pytest

  docker-images:
    # Build the production images so Dockerfile mistakes fail here, not during a deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend production image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: production
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  visual-and-accessibility:
    # Screenshots of key pages in every theme + axe WCAG 2.1 AA scans, rendered in the
    # official Playwright image so results match developer machines exactly.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sh frontend/scripts/visual-tests.sh
      - name: Keep screenshot diffs for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: frontend/test-results
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies and reject deprecated npm packages
        run: |
          install_log="$(mktemp)"
          npm ci --no-audit --no-fund 2>&1 | tee "$install_log"
          if grep -Eiq 'npm warn deprecated' "$install_log"; then
            echo "::error::npm reported deprecated packages; review the install output and update them."
            exit 1
          fi
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chess_academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chess_academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.18
        ports:
          - 1025:1025
          - 8025:8025
      meilisearch:
        image: getmeili/meilisearch:v1.56.2
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ci-only-test-master-key-1234567890
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl --silent --fail http://localhost:7700/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chess_academy_test
      REDIS_URL: redis://localhost:6379/0
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: no-reply@example.com
      MEILISEARCH_URL: http://localhost:7700
      MEILISEARCH_API_KEY: ci-only-test-master-key-1234567890
      E2E_ADMIN_EMAIL: e2e-admin@example.com
      E2E_ADMIN_PASSWORD: ChessTestAccount!2026
      CORS_ORIGINS: '["http://127.0.0.1:5173"]'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen --extra dev && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m app.cli seed-admin --email "$E2E_ADMIN_EMAIL" --password "$E2E_ADMIN_PASSWORD" --name "E2E Admin"
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: nohup python -m arq app.workers.main.WorkerSettings >/tmp/chess-worker.log 2>&1 &
        working-directory: backend
      - run: npm run test:e2e
        working-directory: frontend

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    env:
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
      ALERT_EMAIL_TO: alerts@example.test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability config --quiet
      - run: docker compose --env-file .env.oci.example -f docker-compose.oci.yml -f docker-compose.observability.yml --profile observability config --quiet
      - name: Validate the production Caddy access gate
        run: |
          export SITE_ACCESS_USER=ci-validation
          export SITE_ACCESS_PASSWORD_HASH="$(docker run --rm caddy:2-alpine caddy hash-password --plaintext 'CI-only-validation-password')"
          docker compose --env-file .env.oci.example -f docker-compose.oci.yml run --rm --no-deps --entrypoint caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability build alertmanager-config
      - run: docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability run --rm --no-deps --entrypoint /bin/alloy alloy validate /etc/alloy/config.alloy
      - run: docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability run --rm --no-deps alertmanager-config
      - run: docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability run --rm --no-deps --entrypoint /bin/amtool alertmanager check-config /run/alertmanager-config/alertmanager.yml
      - run: docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability run --rm --no-deps --entrypoint /bin/promtool prometheus check config /etc/prometheus/prometheus.yml
      - run: docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability run --rm --no-deps --entrypoint /bin/promtool prometheus check rules /etc/prometheus/rules/app-alerts.yml
      - run: docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability run --rm --no-deps --entrypoint /bin/promtool prometheus check rules /etc/prometheus/rules/meta-alerts.yml
      - run: docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability build backend observability-heartbeat
      - run: docker build --file frontend/Dockerfile --target production --tag chess-academy-frontend:ci frontend
      - run: sh -n ops/oci/deploy-release.sh

  deploy-oci:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.OCI_DEPLOY_ENABLED == 'true'
    needs: [backend, frontend, end-to-end, container-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
      OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
      OCI_DEPLOY_ROOT: ${{ vars.OCI_DEPLOY_ROOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Configure verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OCI_HOST" && test -n "$OCI_SSH_USER" && test -n "$OCI_SSH_PRIVATE_KEY" && test -n "$OCI_KNOWN_HOSTS"
          : "${OCI_DEPLOY_ROOT:=/srv/chess-academy}"
          [[ "$OCI_DEPLOY_ROOT" =~ ^/srv/[A-Za-z0-9_./-]+$ && "$OCI_DEPLOY_ROOT" != *..* ]]
          install -m 700 -d "$RUNNER_TEMP/academy-ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/academy-ssh/id_ed25519"
          printf '%s\n' "$OCI_KNOWN_HOSTS" > "$RUNNER_TEMP/academy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/academy-ssh/id_ed25519" "$RUNNER_TEMP/academy-ssh/known_hosts"
          echo "OCI_DEPLOY_ROOT=$OCI_DEPLOY_ROOT" >> "$GITHUB_ENV"
      - name: Upload the tested source release
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$OCI_DEPLOY_ROOT/releases/$GITHUB_SHA"
          ssh -i "$RUNNER_TEMP/academy-ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/academy-ssh/known_hosts" "$OCI_SSH_USER@$OCI_HOST" "mkdir -p '$release_dir'"
          git archive --format=tar "$GITHUB_SHA" | gzip -1 | ssh -i "$RUNNER_TEMP/academy-ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/academy-ssh/known_hosts" "$OCI_SSH_USER@$OCI_HOST" "tar -xzf - -C '$release_dir'"
      - name: Deploy, verify health, and roll back on failure
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$OCI_DEPLOY_ROOT/releases/$GITHUB_SHA"
          ssh -i "$RUNNER_TEMP/academy-ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/academy-ssh/known_hosts" "$OCI_SSH_USER@$OCI_HOST" "cd '$release_dir' && sh ops/oci/deploy-release.sh '$OCI_DEPLOY_ROOT' '$GITHUB_SHA'"
