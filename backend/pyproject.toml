[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "chess-academy-api"
version = "0.1.0"
description = "Chess academy scheduling API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.15.2",
  "argon2-cffi==23.1.0",
  "celery==5.4.0",
  "cryptography==44.0.2",
  "email-validator==2.2.0",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  # Use Kombu's Redis extra: Celery 5.4's Redis extra pins redis-py <6,
  # which conflicts with the Redis version required by Kombu 5.7.
  "kombu[redis]==5.7.0",
  "psycopg[binary]==3.2.6",
  "pydantic-settings==2.8.1",
  "python-json-logger==3.3.0",
  "redis==6.4.0",
  "sqlalchemy==2.0.40",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.11.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B"]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
