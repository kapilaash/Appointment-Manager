[project]
name = "chess-academy-backend"
version = "0.1.0"
description = "Scheduling and Demo Class Platform for Chess Academy"
authors = [{ name = "Principal Software Engineer" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.4",
    "pydantic-settings>=2.3.4",
    "sqlalchemy[asyncio]>=2.0.31",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.6",
    "arq>=0.25.0",
    "argon2-cffi>=23.1.0",
    "pytz>=2024.1",
    "python-dateutil>=2.9.0.post0",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "prometheus-client>=0.21.1,<1.0",
    "sentry-sdk[fastapi]>=2.70.0,<3.0",
    "jinja2>=3.1.4",
    "cryptography>=42.0.8",
    "click>=8.1.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.10",
    "mypy>=1.10.0",
    "psycopg[binary]>=3.2.3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# FastAPI dependency injection intentionally uses Depends() in parameter defaults.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
# Several dependencies (arq, argon2, meilisearch client) ship without type stubs.
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
