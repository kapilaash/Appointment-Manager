[project]
name = "chess-academy-backend"
version = "0.1.0"
description = "Scheduling and Demo Class Platform for Chess Academy"
authors = [{ name = "Principal Software Engineer" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.4",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.31",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.6",
    "arq>=0.25.0",
    "argon2-cffi>=23.1.0",
    "pytz>=2024.1",
    "python-dateutil>=2.9.0.post0",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "jinja2>=3.1.4",
    "cryptography>=42.0.8",
    "click>=8.1.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.10",
    "mypy>=1.10.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
