services:
  postgres:
    image: postgres:16-alpine
    container_name: chess_academy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chess_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chess_secure_pass_2025}
      POSTGRES_DB: ${POSTGRES_DB:-chess_academy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chess_admin} -d ${POSTGRES_DB:-chess_academy}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: chess_academy_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.18
    container_name: chess_academy_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chess_academy_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-chess_admin}:${POSTGRES_PASSWORD:-chess_secure_pass_2025}@postgres:5432/${POSTGRES_DB:-chess_academy}
      - REDIS_URL=redis://redis:6379/0
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - FRONTEND_URL=http://localhost:5173
      - SECRET_KEY=${SECRET_KEY:-insecure_dev_secret_key_change_in_production_32bytes_min}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chess_academy_worker
    restart: unless-stopped
    command: python -m arq app.workers.main.WorkerSettings
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-chess_admin}:${POSTGRES_PASSWORD:-chess_secure_pass_2025}@postgres:5432/${POSTGRES_DB:-chess_academy}
      - REDIS_URL=redis://redis:6379/0
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SECRET_KEY=${SECRET_KEY:-insecure_dev_secret_key_change_in_production_32bytes_min}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chess_academy_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
