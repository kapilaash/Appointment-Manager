server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # nginx's built-in MIME list lacks the web app manifest type browsers expect.
  types {
    application/manifest+json webmanifest;
  }
  include /etc/nginx/mime.types;

  # Compress text assets; most of the bundle is JavaScript, CSS and JSON.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Request-ID;
  }

  # Vite fingerprints everything in /assets, so a file's content never changes for its name.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~ /\.(?!well-known/) {
    deny all;
  }

  # The HTML shell must be revalidated so a new release is picked up right away.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
